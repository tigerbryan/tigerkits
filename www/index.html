<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TigerKits - 您的服务器管理平台</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        .logo {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .nav {
            background-color: #34495e;
            padding: 10px 0;
        }
        .nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .nav a:hover {
            background-color: #2c3e50;
        }
        .content {
            background-color: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .service-card {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .service-card h3 {
            color: #2c3e50;
            margin-top: 0;
        }
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">TigerKits</div>
            <p>您的服务器管理平台</p>
        </div>
    </header>
    
    <nav class="nav">
        <div class="container">
            <a href="/">首页</a>
            <a href="http://dashboard.tigerkits.com">控制面板</a>
            <a href="https://github.com/tigerbryan/tigerkits">GitHub</a>
        </div>
    </nav>

    <div class="container">
        <div class="content">
            <h2>欢迎使用 TigerKits</h2>
            <p>TigerKits 是一个集成了多种服务的服务器管理平台，为您提供便捷的服务器管理体验。</p>
            
            <div class="services">
                <div class="service-card">
                    <h3>控制面板</h3>
                    <p>通过 Homarr 控制面板管理您的所有服务，包括 Docker 容器、应用状态等。</p>
                    <a href="http://dashboard.tigerkits.com">访问控制面板</a>
                </div>
                
                <div class="service-card">
                    <h3>文档中心</h3>
                    <p>查看详细的使用说明和部署指南，帮助您更好地使用 TigerKits。</p>
                    <a href="/docs">查看文档</a>
                </div>
                
                <div class="service-card">
                    <h3>GitHub 仓库</h3>
                    <p>访问我们的 GitHub 仓库，获取最新代码和更新。</p>
                    <a href="https://github.com/tigerbryan/tigerkits">访问仓库</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 TigerKits. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
